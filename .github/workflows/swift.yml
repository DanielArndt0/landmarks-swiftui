name: iOS Swift Build

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build iOS app
        run: |
          xcodebuild \
            -project LandmarksApp.xcodeproj \
            -scheme LandmarksApp \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            build